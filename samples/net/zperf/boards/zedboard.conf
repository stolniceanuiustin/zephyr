# Place the GEM buffer-descriptor rings in non-cached RAM. The Zynq-7000 GEM
# DMA does not snoop the PL310 outer cache, so caching the rings leads to
# coherency stalls / silent hangs. NOCACHE_MEMORY makes the driver's __nocache
# BD rings land in a non-cacheable section.
CONFIG_NOCACHE_MEMORY=y

# Bulk RX/TX at 1G needs deeper network thread stacks than the board default.
CONFIG_NET_TX_STACK_SIZE=65536
CONFIG_NET_RX_STACK_SIZE=65536
