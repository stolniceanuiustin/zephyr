sample:
  name: AD9081 + HMC7044 JESD204B bring-up
  description: >
    Brings up a JESD204B subclass-1 link between an AD9081/AD9082 MxFE and the
    ADI AXI JESD204 IP cores in ZynqMP programmable logic: HMC7044 clock tree,
    GT transceivers, link cores, transport cores, then a phase-ordered JESD204
    bring-up to DATA. Ends by capturing ADC samples over DMA and emitting a
    DDS tone on the DAC.
tests:
  sample.drivers.misc.ad9081:
    platform_allow:
      - zynqmp_apu
    tags:
      - spi
      - clock_control
      - dma
      - jesd204
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "SUCCESS: HMC7044 clock tree configured"
        - "SUCCESS: AD90[89][12] detected over SPI"
        - "SUCCESS: GT transceivers configured"
        - "SUCCESS: JESD204 link cores configured"
        - "SUCCESS: TPL transport cores configured"
        - "SUCCESS: JESD204B link up"
        - "=== bring-up complete ==="
