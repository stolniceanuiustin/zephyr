CONFIG_SPI=y
CONFIG_LOG=y
CONFIG_GPIO=y

# HMC7044 clock tree. The driver itself is enabled by its devicetree node
# (CONFIG_CLOCK_CONTROL_HMC7044 defaults to y on DT_HAS_ADI_HMC7044_ENABLED);
# this just turns the subsystem on.
CONFIG_CLOCK_CONTROL=y

# ADI JESD204 AXI IP cores in the PL: adxcvr, link cores, transport layer.
CONFIG_JESD204_AXI=y

# AD9081/AD9082 MxFE driver and its vendor API library.
CONFIG_HAL_ADI_AD9081=y
CONFIG_AD9081=y

# AD9081 datapath DMA engines (ADI AXI DMAC, RX S2MM + TX MM2S in the PL).
CONFIG_DMA=y

# Four drivers BUILD_ASSERT on this: every PL register access uses the physical
# address from devicetree directly. Implied by arm64's `select KERNEL_DIRECT_MAP
# if MMU`, but stated here because the asserts depend on it.
CONFIG_KERNEL_DIRECT_MAP=y

# 1:1 device_map() of the PL AXI IP-core pages (JESD204, adxcvr, TPL, DMA)
# each consume translation tables; the default (12) runs out. Give headroom.
CONFIG_MAX_XLAT_TABLES=24
CONFIG_LOG_MODE_IMMEDIATE=y
