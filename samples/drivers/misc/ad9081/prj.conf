CONFIG_SPI=y
CONFIG_LOG=y
CONFIG_GPIO=y

# HMC7044 clock tree. The driver itself is enabled by its devicetree node
# (CONFIG_CLOCK_CONTROL_HMC7044 defaults to y on DT_HAS_ADI_HMC7044_ENABLED);
# this just turns the subsystem on.
CONFIG_CLOCK_CONTROL=y

# ADI JESD204 AXI IP cores in the PL: adxcvr, link cores, transport layer.
CONFIG_JESD204_AXI=y

# AD9081/AD9082 MxFE driver and its vendor API library.
CONFIG_HAL_ADI_AD9081=y
CONFIG_AD9081=y

# AD9081 datapath DMA engines (ADI AXI DMAC, RX S2MM + TX MM2S in the PL).
CONFIG_DMA=y

# Four drivers BUILD_ASSERT on this: every PL register access uses the physical
# address from devicetree directly. Implied by arm64's `select KERNEL_DIRECT_MAP
# if MMU`, but stated here because the asserts depend on it.
CONFIG_KERNEL_DIRECT_MAP=y

# 1:1 device_map() of the PL AXI IP-core pages (JESD204, adxcvr, TPL, DMA)
# each consume translation tables; the default (12) runs out. Give headroom.
CONFIG_MAX_XLAT_TABLES=24
CONFIG_LOG_MODE_IMMEDIATE=y

# libiio, so the JESD204 datapath can be streamed to a client. The
# adi,axi-jesd-iio nodes in the board overlay turn the IIO device driver on; this
# just enables the library. Which transport serves it is a snippet's job --
# build with `-S iiod-console` for UART or `-S iiod-network` for TCP -- so no
# CONFIG_LIBIIO_IIOD_* is set here.
CONFIG_LIBIIO=y

# Do NOT raise this to CONFIG_LIBIIO_LOG_LEVEL_DBG: libiio traces every command
# it dispatches, and with CONFIG_LOG_MODE_IMMEDIATE each line is written
# synchronously at 115200 baud (~5 ms for a short line). iio_info issues
# thousands of attribute reads, so the added wire time alone exceeds the
# client's default 5 s context timeout and even plain context creation fails.
# Instrument the specific handler under investigation instead.

# libiio allocates exclusively with malloc()/calloc(), which on Zephyr comes from
# the libc arena below -- NOT from CONFIG_HEAP_MEM_POOL_SIZE, which backs
# k_malloc() and which libiio never calls. Sizing only the kernel heap leaves
# libiio with the 16 KB arena default: context creation alone consumes that, and
# the first sample block a client asks for then fails with -ENOMEM, which the
# client reports only as "Unable to create stream: Connection timed out".
#
# 512 KB covers a full-size capture with room to spare: the largest block a
# client requests here is 2048 samples x 8 converters x 2 B = 32768 B, several
# may be in flight at once, and the context description and per-connection IIOD
# state come out of the same arena. RAM is 2 GB, so this costs nothing.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=524288

# Kernel heap, for k_malloc() callers elsewhere in the sample. Deliberately kept
# separate from the libc arena above; raising this one does not help libiio.
CONFIG_HEAP_MEM_POOL_SIZE=262144
