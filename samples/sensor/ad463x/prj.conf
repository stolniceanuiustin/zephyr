CONFIG_EEPROM=y
CONFIG_EEPROM_ADI_AXI_SYSID=y
CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_ADI_AXI_CLKGEN=y
CONFIG_DMA=y
CONFIG_DMA_ADI_AXI_DMAC=y
CONFIG_PWM=y
CONFIG_PWM_ADI_AXI_PWMGEN=y
CONFIG_SPI=y
CONFIG_SPI_ADI_AXI_SPI_ENGINE=y
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_ADC_AD463X=y
CONFIG_LOG=y
# Debug: synchronous logging so we see output up to the exact hang point,
# instead of deferred logs that never flush if boot hangs early.
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_CACHE_MANAGEMENT=y
CONFIG_NOCACHE_MEMORY=y

# Cortex-A9 (cortex_a_r AArch32) keeps small, fixed per-mode banked stacks
# (SYS/SVC/exception), and these have no overflow guard. The default sizes
# (1 KB SYS, 512 B SVC, 256 B exception) are too small for this driver's
# DMA-completion ISR path combined with CONFIG_LOG_MODE_IMMEDIATE, which
# formats and pushes to the UART from ISR context. Overflow silently
# corrupts adjacent memory and derails control flow (branch to a bogus
# address -> prefetch/data abort). Give the interrupt/exception path room.

CONFIG_ARMV7_EXCEPTION_STACK_SIZE=8192
CONFIG_ARMV7_FIQ_STACK_SIZE=8192
CONFIG_ARMV7_SVC_STACK_SIZE=8192
CONFIG_ARMV7_SYS_STACK_SIZE=8192
CONFIG_IDLE_STACK_SIZE=8192
CONFIG_ISR_STACK_SIZE=8192
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
