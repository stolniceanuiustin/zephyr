# SPDX-License-Identifier: Apache-2.0
#
# Minimal binding for the HMC7044 SPI scratchpad probe. Just a plain SPI device
# -- not a full HMC7044 clock driver binding. The HMC7044 has no hardware reset
# pin on this board (it soft-resets over SPI).

description: HMC7044 SPI scratchpad probe device

compatible: "adi,hmc7044-probe"

include:
  - name: spi-device.yaml
