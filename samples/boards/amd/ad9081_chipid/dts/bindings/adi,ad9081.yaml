# SPDX-License-Identifier: Apache-2.0
#
# ADI AD9081/AD9082 MxFE (mixed-signal front end): 4 DAC + 4 ADC with an
# on-chip JESD204 framer (JTX) and deframer (JRX).
#
# Property names follow ADI's Linux binding for this part (the node axi_ad9081
# in zynqmp-zcu102-rev10-ad9081-m8-l4-overlay.dts). The compatible is
# "adi,ad9081" for both parts, as ADI's driver does: they are the same family
# behind one register map, and the difference is a PROD_ID the driver reads back
# and reports.
#
# Rates are in kHz, not Hz. Zephyr's `type: int` is a single 32-bit cell -- a
# /bits/ 64 value is rejected by dtlib -- and the DAC runs at 12 GHz. kHz keeps
# every rate exact (12 GHz = 12000000 kHz) in one cell, and matches the local
# adi,lane-rate-khz precedent and no-OS's own kHz spellings.
#
# NOT ported from the Linux node, and why:
#   clocks / clock-names -- Linux takes the device REFCLK as a phandle to the
#     HMC7044 output that drives it. Stated as a rate here instead: the REFCLK
#     output (DEV_REFCLK, out2) is not the one this port queries, and adding a
#     second consumer of the HMC7044 would reorder init against a driver whose
#     rates are already verified. adi,ref-clk-frequency-khz must equal that
#     output's rate -- tools/check_profile.py cross-checks the two.
#   adi,jesd-* geometry (M, L, F, K, N, NP, CS, S, subclass) -- deliberately
#     absent. Those numbers already live in the tx_jesd/rx_jesd link-core nodes,
#     one per direction, and restating them here would make a third copy of the
#     same link description for the drift to happen between. The chip node
#     points at the two cores with adi,jesd-tx-link / adi,jesd-rx-link and the
#     driver reads the geometry from whichever one describes that direction.
#   jesd204-device / #jesd204-cells / jesd204-inputs -- Linux's generic JESD204
#     framework binding. Not ported: this board has one converter and two
#     fixed links, so the full jesd204-cells indirection is unwarranted
#     generality. adi,jesd204-devices below is the minimal equivalent this
#     port actually needs -- see it for what devicetree does and does not
#     control about the FSM topology.

description: |
  ADI AD9081/AD9082 MxFE.

  init() only marks the device ready. The chip is brought up by explicit
  ad9081_probe() / ad9081_setup_datapath() calls from the bring-up sequence,
  which configure the converter datapath and both JESD204 links but hold the
  links disabled -- activating them has to happen together with the FPGA
  transceiver and link cores, which init-level ordering cannot express.

compatible: "adi,ad9081"

include:
  - name: spi-device.yaml

properties:
  reset-gpios:
    type: phandle-array
    description: |
      AD9081 hardware reset (RSTB), active low. Optional: without it the
      vendor API's hard-reset path degrades to a register-write soft reset.

      No `label` property, unlike the PL core nodes here: this driver's log
      lines carry the LOG_MODULE_REGISTER(ad9081) prefix rather than
      dev->name, so the node name never reaches the boot log.

  # ---------------------------------------------------------------- clocks ---

  adi,dac-frequency-khz:
    type: int
    required: true
    description: |
      DAC sample rate. Not free: the TX interpolation factors divide it down to
      the JESD204 sample rate the link carries, so it must equal
      adc-frequency-khz * (TX interp product) / (RX decim product) for a link
      that runs both directions at one rate.

  adi,adc-frequency-khz:
    type: int
    required: true
    description: ADC sample rate.

  adi,ref-clk-frequency-khz:
    type: int
    required: true
    description: |
      Device REFCLK at the chip's pin, from the HMC7044's DEV_REFCLK output.
      The on-chip CLK PLL is engaged whenever this differs from the DAC rate,
      which the driver leaves to the vendor API to decide.

  # ------------------------------------------------------- link references ---

  adi,jesd-tx-link:
    type: phandle
    required: true
    description: |
      The link core describing the TX (DAC) direction, which the chip's JRX
      deframer terminates. The driver takes M, L, F, K, N, NP, CS, S and
      subclass from this node rather than from its own properties, so one link
      is described in one place.

      ADI names both ends of a link by datapath direction, so this is the
      tx_jesd core and the chip's *receiving* deframer -- not a crossover.

  adi,jesd-rx-link:
    type: phandle
    required: true
    description: |
      The link core describing the RX (ADC) direction, which the chip's JTX
      framer sources. Geometry is read from it as for the TX link.

  adi,tx-jesd-mode-id:
    type: int
    required: true
    description: |
      Vendor link-mode index for the deframer (9 for M8/L4/F4 on this profile).
      Redundant with the geometry in principle -- the vendor API uses it to
      select an internal table -- but the API takes it as an input and there is
      no exported mapping to derive it from, so it is stated and cross-checked.

  adi,rx-jesd-mode-id:
    type: int
    required: true
    description: Vendor link-mode index for the framer (10 on this profile).

  adi,jesd204-devices:
    type: phandles
    required: true
    description: |
      The FPGA-side devices that take part in this chip's JESD204 bring-up:
      tx_adxcvr, rx_adxcvr, tx_jesd, rx_jesd, in that fixed order (one entry
      per role -- jesd_fsm.c indexes this array positionally, not by name).

      This says which devices PARTICIPATE. It does not say in what order they
      are visited within a bring-up phase, or which phases they participate
      in -- both of those are hardware dependency order (GT reset-release
      before the converter's JESD PLL check, etc.) and stay fixed in
      jesd_fsm.c's board_topology_devs[], not devicetree. Removing a role here
      (or giving its node status = "disabled") removes it from the topology; a
      board cannot reorder the remaining roles by editing this property.

      No relation to Linux's jesd204-device / #jesd204-cells framework -- see
      the note above this property block for why that generality is not
      ported.

  # ------------------------------------------------------------- TX (JRX) ---

  adi,tx-main-interpolation:
    type: int
    required: true
    description: Coarse (main datapath) interpolation factor.

  adi,tx-channel-interpolation:
    type: int
    required: true
    description: Fine (per-channel) interpolation factor.

  adi,tx-dac-channel-crossbar:
    type: array
    required: true
    description: |
      Per-DAC bitmask of which channelisers feed it, one entry per DAC (4).
      Board wiring, from the no-OS profile.

  adi,tx-main-nco-shift-hz:
    type: array
    required: true
    description: |
      Main (coarse) DAC NCO frequency shift, one entry per DAC (4), in Hz.
      Signed. Hz rather than kHz here because these are exact in one cell at
      the values this chip supports and the vendor API takes Hz.

  adi,tx-channel-nco-shift-hz:
    type: array
    required: true
    description: Fine (per-channel) DAC NCO shift, one entry per channel (8), Hz.

  adi,tx-channel-gains:
    type: array
    required: true
    description: |
      Per-channel digital gain, one entry per channel (8). 1024 is unity in the
      vendor API's 1.10 fixed-point format; 0 disables the channel.

  adi,tx-logical-lane-mapping:
    type: array
    required: true
    description: |
      Deframer lane crossbar: for each of the 8 physical lanes, which logical
      link lane it carries. 7 marks a lane that is not connected. Board wiring
      (which SERDES pin goes to which FMC lane), so it comes from the no-OS
      profile and is not derivable.

      "-mapping", not "-map": edtlib treats any property ending in "-map" as a
      specifier map (like gpio-map) and demands a matching #<name>-cells. It is
      also no-OS's own field name (logical_lane_mapping, ad9081.h:147).

  # ------------------------------------------------------------- RX (JTX) ---

  adi,rx-coarse-ddc-select:
    type: int
    required: true
    description: Bitmask of enabled coarse DDCs (0xF = all 4).

  adi,rx-fine-ddc-select:
    type: int
    required: true
    description: Bitmask of enabled fine DDCs (0x33 = DDCs 0, 1, 4, 5).

  adi,rx-coarse-decimation:
    type: array
    required: true
    description: |
      Coarse DDC decimation ratio, one entry per coarse DDC (4). Stated as the
      ratio (4), not the vendor register code -- the codes are not monotonic
      (AD9081_CDDC_DCM_4 is 0x1, DCM_2 is 0x0) so a raw code in devicetree
      would be unreadable and unreviewable. The driver maps ratio -> code and
      rejects a ratio the part does not offer.

  adi,rx-fine-decimation:
    type: array
    required: true
    description: |
      Fine DDC decimation ratio, one entry per fine DDC (8), as above. 0 marks
      a disabled fine DDC, matching the no-OS profile's spelling.

  adi,rx-coarse-nco-shift-hz:
    type: array
    required: true
    description: Coarse DDC NCO shift, one entry per coarse DDC (4), in Hz. Signed.

  adi,rx-fine-nco-shift-hz:
    type: array
    required: true
    description: Fine DDC NCO shift, one entry per fine DDC (8), in Hz. Signed.

  adi,rx-coarse-complex-to-real:
    type: array
    description: |
      Per-coarse-DDC complex-to-real conversion enable (4 entries). Omit for
      all-zero, which is this profile: the link carries complex samples.

  adi,rx-fine-complex-to-real:
    type: array
    description: Per-fine-DDC complex-to-real conversion enable (8 entries).

  adi,rx-logical-lane-mapping:
    type: array
    required: true
    description: |
      Framer lane crossbar, same meaning and provenance as
      adi,tx-logical-lane-mapping. Not the same values: transmit and receive are
      wired independently on this board.

  adi,rx-link-converter-select:
    type: array
    required: true
    description: |
      Which physical converter each of the 16 virtual converters on the link
      carries. Only the first M (8) entries are meaningful; the rest are
      padding the vendor struct requires.
