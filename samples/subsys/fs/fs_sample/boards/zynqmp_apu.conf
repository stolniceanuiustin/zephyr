# ZCU102 (ZynqMP A53/APU) config for the fs_sample FAT demo on SD1.
#
# The SD/FAT/disk-access stack all auto-enables from the devicetree node added
# in zynqmp_apu.overlay:
#   - the "xlnx,versal-8.9a" node   -> CONFIG_XLNX_SDHC
#   - the "zephyr,sdmmc-disk" child -> CONFIG_DISK_DRIVER_SDMMC + CONFIG_SDMMC_STACK
# and fs_sample/prj.conf already turns on DISK_ACCESS + FAT (ELM). So nothing
# extra is strictly required to build. The settings below are for reliable
# first bring-up on the A53.

# --- DMA cache coherency (IMPORTANT) ---------------------------------------
# xlnx_sdhc uses ADMA2 DMA but performs NO cache maintenance on its descriptor
# table or data buffers -- it was written for the Versal R5/R52 where that path
# is coherent/uncached. On Cortex-A53 the MMU + D-cache are on and DMA is not
# coherent, so cached DMA buffers would return stale/garbage data. The simplest
# correct first bring-up is to disable the D-cache. Once the SD path is proven,
# the "real" fix is to add sys_cache_data_flush/invalidate_range() around the
# ADMA buffers in the driver and re-enable the cache.
CONFIG_DCACHE=y

# --- Debug visibility for bring-up -----------------------------------------
CONFIG_LOG=y
CONFIG_SD_LOG_LEVEL_DBG=y
CONFIG_SDHC_LOG_LEVEL_DBG=y

# Give the SD stack's internal bounce buffers / init some headroom.
CONFIG_MAIN_STACK_SIZE=8192

# --- Target a specific MBR partition on the boot card ----------------------
# The ZCU102 boots from this SD card, which is partitioned as:
#   p1: PetaLinux rootfs (ext4)  -- ignored (not FAT)
#   p2: FAT boot (BOOT.bin, boot.scr, zephyr.bin) -- MUST NOT be touched
#   p3: FAT data  <-- Zephyr reads/writes here
# Multi-partition lets FatFs bind the "SD" volume to a chosen MBR partition via
# the VolToPart[] table supplied by the app (see src/main.c). Without this,
# FatFs would look for a filesystem at LBA 0 (the MBR) and fail to mount.
CONFIG_FS_FATFS_MULTI_PARTITION=y

# Never auto-format: the mount is flagged NO_FORMAT in the app, but make doubly
# sure the on-mount mkfs path is compiled out so a mount miss can never reformat
# any partition on the boot card.
# CONFIG_FS_FATFS_MOUNT_MKFS is not set
