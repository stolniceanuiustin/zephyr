# Placeholder DAQ2 sample: a plain "hello world" for now. The DAQ2 datapath
# (JESD204/DMA in the PL) will be layered on later, mirroring
# samples/drivers/misc/ad9081.
#
# The options below are the board/boot-relevant subset carried over from the
# ad9081 sample so this boots cleanly on the ZCU102 A53 with a PL bitstream
# loaded. The AD9081-specific driver enables (CONFIG_SPI / CONFIG_JESD204_AXI /
# CONFIG_HAL_ADI_AD9081 / CONFIG_AD9081 / CONFIG_DMA / CONFIG_LIBIIO ...) are
# deliberately NOT here: they require the matching devicetree nodes, which live
# in an overlay this sample does not have yet, and they target different silicon.

# Console logging, written synchronously so nothing is lost across the handoff
# from U-Boot `go` into Zephyr.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# DAQ2 clock generator (AD9523-1) over PS SPI. CONFIG_CLOCK_CONTROL_AD9523 and
# SPI are auto-selected from the devicetree node in boards/zynqmp_apu.overlay;
# these two are the subsystem enables the driver builds on.
CONFIG_SPI=y
CONFIG_CLOCK_CONTROL=y

# Every PL register access uses the physical address from devicetree directly.
# Implied by arm64's `select KERNEL_DIRECT_MAP if MMU`, but stated explicitly to
# match the ad9081 boot environment.
CONFIG_KERNEL_DIRECT_MAP=y

# Headroom for 1:1 device_map() of PL AXI IP-core pages once a datapath overlay
# is added; the default (12) runs out. Harmless for hello world.
CONFIG_MAX_XLAT_TABLES=24

# ZynqMP PS EMIO GPIO: drives the AD9144 RESETB (the generic BOOT.BIN psu_init
# leaves it undriven, so the DAC stays in reset without this).
CONFIG_GPIO=y
