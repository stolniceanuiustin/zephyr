CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_CLOCK_CONTROL=y

# ADI JESD204 AXI IP cores in the PL: adxcvr, link cores, transport layer.
CONFIG_JESD204_AXI=y

# AD9081/AD9082 MxFE driver and its vendor API library.
CONFIG_HAL_ADI_AD9081=y
CONFIG_AD9081=y

# The three PL drivers BUILD_ASSERT on this: they device_map() their register
# pages and every sys_read32() assumes virt == phys.
CONFIG_KERNEL_DIRECT_MAP=y

# Each 1:1 device_map() of a PL page consumes translation tables; the default
# (12) runs out with this many cores instantiated.
CONFIG_MAX_XLAT_TABLES=24
