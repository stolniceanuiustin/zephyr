# SPDX-License-Identifier: Apache-2.0
#
# ADI AXI-JESD204 TX link core (the JESD204B deframer's link layer).
#
# Property names follow ADI's Linux binding for this IP
# (Documentation/devicetree/bindings/iio/jesd204/adi,jesd204-tx.txt); the
# compatible string is the of_match entry in
# drivers/iio/jesd204/axi_jesd204_tx.c:1068 and the node in ADI's devicetree for
# this board is zynqmp-zcu102-rev10-ad9081-default.dtsi (axi_ad9081_tx_jesd).
#
# The TX binding carries more geometry than the RX one because the deframer is
# the end that ANNOUNCES the link during ILAS: N, CS and S appear in the ILAS
# words and in its checksum, so they have to be stated here. The framer only
# receives that announcement, which is why adi,axi-jesd204-rx.yaml has neither.
#
# adi,high-density is DELIBERATELY ABSENT even though ADI's binding lists it as
# an optional property. HD is not free: it is 1 only when a converter sample
# splits across lanes, which M/S/NP/L/F decide. The driver derives it and pins
# the derivation with a BUILD_ASSERT. no-OS's profile for this board carries
# HD=1 where the geometry requires 0 (harmless at F=4, since nothing splits
# either way) -- a settable property is exactly how that value would get copied
# back in. See tools/check_profile.py, which derives it independently.
#
# Properties of ADI's Linux node that are NOT ported (clocks/clock-names,
# #clock-cells, clock-output-names, interrupts, jesd204-*): same reasons as the
# RX binding, listed there.

description: |
  ADI AXI-JESD204 TX link core: the transmit link layer between the TX
  transport core and the GT transceiver. Scrambles, frames and emits the
  Initial Lane Alignment Sequence that describes the link to the far end.

  Configure-only at boot -- the geometry and ILAS words are programmed with the
  link held disabled, because a JESD204 link only comes alive when the
  transceiver, both link cores, SYSREF and the converter are activated
  together.

compatible: "adi,axi-jesd204-tx-1.0"

include: base.yaml

properties:
  reg:
    required: true
    description: |
      A full 64 KiB page, not ADI's 0x1000. The register block is smaller, but
      this is what gets device_map()ed and the MMU granularity here is a page.

  label:
    description: |
      Deliberately used here, despite the general deprecation. Every log line
      this driver emits is prefixed with the device name and the boot log is
      diffed against a reference captured from hardware; "jesd204-tx" keeps
      those lines byte-identical to what the pre-devicetree code produced,
      where the node name "axi-jesd204-tx@84b90000" would not.

  adi,octets-per-frame:
    type: int
    required: true
    description: |
      Octets per frame (F). Announced in ILAS word 1 as F-1 and folded into the
      ILAS checksum; with K it also gives the octets per multiframe programmed
      into CONF0.

  adi,frames-per-multiframe:
    type: int
    required: true
    description: |
      Frames per multiframe (K). K * F octets per multiframe must be a whole
      multiple of the core's synthesised data-path width; the driver checks it
      at runtime, because the width is read from the core rather than declared.

  adi,converters-per-device:
    type: int
    required: true
    description: |
      Converters per device (M). ILAS word 2, bits [7:0], as M-1.

  adi,converter-resolution:
    type: int
    required: true
    description: |
      Converter resolution in bits (N). ILAS word 2, bits [12:8], as N-1.

  adi,bits-per-sample:
    type: int
    required: true
    description: |
      Bits per sample on the link (NP), N plus any control/tail bits. ILAS
      word 2, bits [20:16], as NP-1.

  adi,control-bits-per-sample:
    type: int
    default: 0
    description: |
      Control bits per sample (CS). ILAS word 2, bits [15:14]. 0 on this link --
      the converters carry no control bits -- which is also ADI's Linux default
      when the property is absent.

  adi,samples-per-converter-per-frame:
    type: int
    default: 1
    description: |
      Samples per converter per frame (S). ILAS word 2, bits [28:24], as S-1.

      Not an ADI Linux property for this IP: their TX driver hardcodes
      samples_per_conv_frame = 1 (axi_jesd204_tx.c:397). The name is ADI's from
      their converter bindings (adi,ad9081.yaml). Stated here because it is a
      bitstream parameter -- make TX_JESD_S=1 -- so check_profile.py can compare
      it against the synthesised value rather than against a hardcoded 1.

  adi,lanes-per-device:
    type: int
    required: true
    description: |
      Lanes per link (L). ILAS word 1, bits [12:8], as L-1.

      Not an ADI Linux property for this IP: Linux takes the lane count from the
      core's own SYNTH_NUM_LANES register. This port states it as well, for two
      reasons -- the driver warns when the synthesised count disagrees with it
      (which is how a wrong bitstream is caught), and tools/check_profile.py
      cross-checks it against the bitstream's TX_JESD_L make parameter.

  adi,subclass:
    type: int
    default: 1
    description: |
      JESD204B subclass. ILAS word 2, bits [23:21]. Subclass 1 (the default, and
      what this board is) means SYSREF is used for deterministic latency, so the
      driver leaves SYSREF_DISABLE clear and does not enable
      buffer-early-release -- both of which no-OS only does for subclass 0.
