# SPDX-License-Identifier: Apache-2.0
#
# AD9144 -- 16-bit, quad-channel JESD204B DAC, SPI-programmed. On the DAQ2 FMC it
# is the TX converter, clocked by the AD9523-1 (DAC_CLK).
#
# Property names follow ADI's Linux adi,ad9144 binding so a devicetree written
# for ADI Linux transfers with only syntax changes. This binding covers the
# standalone SPI bring-up only -- the JESD204B link geometry below -- not the AXI
# link cores, transceivers or the interpolation datapath (those are a later
# block).
#
# GEOMETRY IS DERIVED, NOT FREE. The JESD204B ILAS configuration bytes written to
# the chip and the serial lane rate are computed from these properties at build
# time, and each computed byte is BUILD_ASSERT-ed in ad9144.c against the value
# the no-OS reference writes for the synthesised DAQ2 TX bitstream (M=2, L=4,
# S=1, LANE_RATE=10). A geometry that disagrees with the bitstream fails the
# build. Some of these parameters are functions of the others (F = M*N'*S/(8*L);
# CS = N'-N; S = F*8*L/(M*N'); HD = F*8 < N'; lane rate = fs*M*N'*10/(8*L*interp))
# -- they are listed separately to mirror the Linux node, and the cross-checks
# are the BUILD_ASSERTs, so do not treat them as independently tunable. HD and
# the lane crossbar are NOT properties: HD is derived in the driver, and the
# crossbar is the confirmed identity board wiring, tied down in the driver.
#
# SPI mode 0 is set in the driver's SPI operation flags, not here -- the AD9144,
# AD9523 and AD9680 all use mode 0 on this board (no-OS DAQ2 inits all three
# NO_OS_SPI_MODE_0).
#
# INIT LEVEL: SPI-attached, so POST_KERNEL after CONFIG_SPI_INIT_PRIORITY and
# after the AD9523 clock generator (a BUILD_ASSERT and the Kconfig default
# enforce the ordering).

description: |
  Analog Devices AD9144 16-bit quad JESD204B DAC (SPI bring-up).

compatible: "adi,ad9144"

include:
  - name: spi-device.yaml

properties:
  clocks:
    required: true
    description: The DAC sample clock (DAC_CLK), e.g. an AD9523-1 output.

  clock-names:
    required: true
    description: Must contain "dac_clk".

  reset-gpios:
    type: phandle-array
    description: |
      RESETB pin (active-low). The driver asserts then releases it before the
      SPI ID read. Optional -- omit on boards that strap RESETB high. On DAQ2
      this is a ZynqMP PS EMIO pin the generic BOOT.BIN psu_init leaves
      undriven, so it must be released in software.

  adi,sampling-frequency-khz:
    type: int
    required: true
    description: |
      DAC sample rate in kHz (carried in kHz to keep the lane-rate arithmetic
      32-bit). DAQ2 = 1000000 (1 GHz). The serial lane rate is derived from this
      and the geometry, not set directly.

  adi,converters-per-device:
    type: int
    required: true
    description: M -- number of converters per device. DAQ2 = 2.

  adi,lanes-per-device:
    type: int
    required: true
    description: L -- number of serial lanes per device. DAQ2 = 4.

  adi,octets-per-frame:
    type: int
    required: true
    description: |
      F -- octets per frame per lane. Not free: F = M*N'*S/(8*L). DAQ2 = 1.

  adi,frames-per-multiframe:
    type: int
    required: true
    description: K -- frames per multiframe. DAQ2 = 32.

  adi,converter-resolution:
    type: int
    required: true
    description: N -- converter resolution in bits. DAQ2 = 16.

  adi,bits-per-sample:
    type: int
    required: true
    description: N' -- total bits per sample (N + control + tail). DAQ2 = 16.

  adi,control-bits-per-sample:
    type: int
    required: true
    description: |
      CS -- control bits per sample. Not free: CS = N' - N when there are no
      tail bits. DAQ2 = 0 (AD9144 is 16-bit, so N' = N).

  adi,subclass:
    type: int
    required: true
    description: JESD204B device subclass. DAQ2 = 1.

  adi,interpolation:
    type: int
    required: true
    description: |
      Datapath interpolation factor. DAQ2 = 1 (no interpolation). Used in the
      derived lane-rate check.
