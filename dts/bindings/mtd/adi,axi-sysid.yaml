description: |
  Analog Devices AXI System ID core.

  Exposes an FPGA build-information ROM (board / product / git data) through
  the standard read-only EEPROM API. The ROM size is auto-detected from the
  core at init; the "size" property is informational only.

compatible: "adi,axi-sysid"

include: eeprom-base.yaml

properties:
  reg:
    required: true
